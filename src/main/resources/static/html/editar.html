<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
</head>
<body>
<h1>Editar Produto</h1>

<form id="formBuscarProduto">
    <label for="idProduto">ID do Produto:</label>
    <input type="number" id="idProduto" name="idProduto" required><br>

    <button type="submit">Buscar Produto</button>
</form>

<form id="formEditarProduto" style="display:none;">
    <h2>Editar Produto</h2>
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required><br>

    <label for="descricao">Descrição:</label>
    <input type="text" id="descricao" name="descricao" required><br>

    <label for="preco">Preço:</label>
    <input type="number" id="preco" name="preco" required><br>

    <label for="quantidadeEstoque">Quantidade em Estoque:</label>
    <input type="number" id="quantidadeEstoque" name="quantidadeEstoque" required><br>

    <button type="submit">Salvar Alterações</button>
</form>

<div id="mensagem" style="margin-top: 15px; font-weight: bold;"></div>

<script>
    // Buscar produto pelo ID
    document.getElementById("formBuscarProduto").addEventListener("submit", function(event) {
        event.preventDefault();

        const idProduto = document.getElementById("idProduto").value;

        // Faz a requisição GET para buscar o produto
        fetch(`/api/produtos/selecionar/${idProduto}`)
            .then(response => {
            if (!response.ok) {
                console.error("Erro na resposta do servidor:", response); // Adiciona log
                throw new Error("❌ Produto não encontrado.");
            }
            return response.json();
        })
            .then(produto => {
                // Preenche os campos do formulário de edição com os dados do produto
                document.getElementById("nome").value = produto.nome;
                document.getElementById("descricao").value = produto.descricao;
                document.getElementById("preco").value = produto.preco;
                document.getElementById("quantidadeEstoque").value = produto.quantidadeEstoque;

                // Exibe o formulário de edição
                document.getElementById("formEditarProduto").style.display = "block";
            })
            .catch(error => {
                console.error("Erro na requisição:", error); // Adiciona log
                document.getElementById("mensagem").textContent = error.message;
            });
    });

    // Editar o produto
    document.getElementById("formEditarProduto").addEventListener("submit", function(event) {
        event.preventDefault();

        const idProduto = document.getElementById("idProduto").value;

        // Obtém os dados do formulário de edição
        const produtoEditado = {
            nome: document.getElementById("nome").value,
            descricao: document.getElementById("descricao").value,
            preco: parseFloat(document.getElementById("preco").value),
            quantidadeEstoque: parseInt(document.getElementById("quantidadeEstoque").value)
        };

        // Faz a requisição PATCH para editar o produto
        fetch(`/api/produtos/atualizarParcial/${idProduto}`, {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(produtoEditado)
        })
            .then(async response => {
                const mensagem = await response.text();

                if (!response.ok) {
                    throw new Error("❌ " + mensagem);
                }

                document.getElementById("mensagem").textContent = "✅ " + mensagem;
                document.getElementById("formBuscarProduto").reset();
                document.getElementById("formEditarProduto").style.display = "none"; // Oculta formulário
            })
            .catch(error => {
                console.error("Erro na requisição:", error);
                document.getElementById("mensagem").textContent = error.message;
            });
    });
</script>
</body>
</html>
